name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Run gofmt on:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: cross-build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: heavier ledger, large items
        # The P0 test of docs/consensus-audit.md with an entry over 16 MiB;
        # it is skipped under -race, so it runs here on its own.
        run: go test -count=1 -run TestHeavierLedgerHuge ./pkg/p2p
      - name: demo
        run: go run ./cmd/poo demo -quiet
      - name: fuzz
        run: FUZZTIME=5s ./scripts/fuzz.sh
      - name: release build
        run: DIST="$RUNNER_TEMP/dist" ./scripts/release.sh 0.0.0-ci
