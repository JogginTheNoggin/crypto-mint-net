name: Release

# Pushing a tag vX.Y.Z builds the release archives and opens a draft
# release with them. The owner reviews and publishes the draft by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: |
          go test -race -count=1 ./...
          go -C gui test -race -count=1 ./...
      - name: build
        run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/*
