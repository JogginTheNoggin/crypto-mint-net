<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poon GUI</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <span class="brand">poon</span>
  <span class="where" id="where" title="The node policy flags added to every command"></span>
  <span class="version" id="version" hidden title="The release this GUI runs: poon and poon-gui share one version (poon version prints the same)"></span>
  <span class="badge view-only" id="view-only" hidden title="poon-gui -view-only: every command runs in poon's view-only mode, so it reads with the node's view token and anything that changes something is refused">view only</span>
</header>
<div class="layout">
  <nav id="nav" aria-label="Views"></nav>
  <main id="main" tabindex="-1"></main>
</div>
</body>
</html>
